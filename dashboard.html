<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel da pesquisa ICOM</title>
  <meta name="description" content="Respostas da pesquisa de qualidade ICOM: casos críticos, fila de ajuste rápido e comparação entre clientes e ex-clientes.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>
  <header class="cab">
    <div class="cab-in">
      <div>
        <h1>Pesquisa de qualidade ICOM</h1>
        <p class="sub" id="status">Carregando…</p>
      </div>
      <div class="cab-acoes">
        <button class="btn" type="button" id="btnAtualizar">Atualizar</button>
        <button class="btn" type="button" id="btnCsv">Exportar CSV</button>
        <button class="btn" type="button" id="btnTema" aria-label="Alternar tema claro/escuro">◐</button>
      </div>
    </div>
    <div class="filtros" id="filtros">
      <label>Evento <select id="fEvento"><option value="">Todos</option></select></label>
      <label>Situação <select id="fCaminho">
        <option value="">Todos</option>
        <option value="A">Clientes atuais (A)</option>
        <option value="B">Ex-clientes (B)</option>
      </select></label>
      <label>Função <select id="fFuncao"><option value="">Todas</option></select></label>
      <label>Produto <select id="fProduto"><option value="">Todos</option></select></label>
    </div>
  </header>

  <div id="chave" class="chave" hidden>
    <form id="formChave">
      <h2>Acesso ao painel</h2>
      <p>As respostas têm nome e WhatsApp das clínicas. Digite a senha do painel.</p>
      <input type="password" id="inChave" autocomplete="current-password" placeholder="Senha" inputmode="numeric" required>
      <p class="erro" id="erroChave" hidden>Senha inválida (ou painel bloqueado por 15 min após muitas tentativas).</p>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </div>

  <main id="painel" class="painel"></main>
  <div id="tip" class="tip" role="tooltip" hidden></div>

  <script src="config.js"></script>
  <script src="assets/pesquisa.js"></script>
  <script src="assets/demo.js"></script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
